<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="categoriestest.css">
</head>
    <body>
        <div class="category-tabs">
        <!-- Tab 1 -->
        <input type="radio" name="category-group" id="tab-all" checked>
        <label for="tab-all">All Items</label>

        <!-- Tab 2 -->
        <input type="radio" name="category-group" id="tab-design">
        <label for="tab-design">Design</label>

        <!-- Tab 3 -->
        <input type="radio" name="category-group" id="tab-dev">
        <label for="tab-dev">Development</label>

        <!-- Content Panels -->
        <div class="tab-panel" id="panel-all">
            <h3>All Categories</h3>
            <p>Showing all available items across design and development.</p>
        </div>

        <div class="tab-panel" id="panel-design">
            <h3>Design Category</h3>
            <p>UI kits, wireframes, and typography resources.</p>
        </div>

        <div class="tab-panel" id="panel-dev">
            <h3>Development Category</h3>
            <p>HTML, CSS, and JavaScript code snippets.</p>
        </div>
        </div>
    </body>
</html>
