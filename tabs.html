<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tabs2.css">
</head>
    <body>
        <div class="tabs">
        <!-- Tab 1 -->
        <input type="radio" name="tabset" id="tab1" checked>
        <label for="tab1">Overview</label>
        <div class="tab-panel">
            <h3>Overview</h3>
            <p>This tab is open by default because of the checked attribute.</p>
        </div>

        <!-- Tab 2 -->
        <input type="radio" name="tabset" id="tab2">
        <label for="tab2">Features</label>
        <div class="tab-panel">
            <h3>Features</h3>
            <p>Clicking a label checks its matching radio input and reveals this panel.</p>
        </div>

        <!-- Tab 3 -->
        <input type="radio" name="tabset" id="tab3">
        <label for="tab3">Pricing</label>
        <div class="tab-panel">
            <h3>Pricing</h3>
            <p>No JavaScript is required for basic switching.</p>
        </div>
        </div>
    </body>
</html>
